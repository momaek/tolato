name: release-agent

# Build tolato-agent binaries on tag push and attach them to a GitHub Release.
# Tag format: agent-v*  (e.g. agent-v0.1.0) — the agent versions independently
# of the server (which uses bare v* tags, see release-image.yml).
#
# The install script (scripts/install.sh) fetches
#   https://github.com/<repo>/releases/latest/download/tolato-agent-<os>-<arch>
# so the asset names below must stay in sync. Only this workflow publishes
# GitHub Releases, so /releases/latest always resolves to the latest agent.

on:
  push:
    tags:
      - 'agent-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: agent/go.sum

      - name: build
        working-directory: agent
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          # Tag push → e.g. "agent-v0.2.0"; manual run → branch name. The
          # self-update flow compares this to the running version, so it must be
          # accurate. Strip the "agent-" tag prefix so the reported version is
          # the bare "v0.2.0".
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${REF_NAME#agent-}"
          OUT="tolato-agent-${GOOS}-${GOARCH}"
          LDFLAGS="-s -w -X github.com/momaek/tolato/agent/internal/client.Version=${VERSION}"
          go build -trimpath -ldflags "${LDFLAGS}" -o "../dist/${OUT}" ./cmd/agent
          (cd ../dist && sha256sum "${OUT}" > "${OUT}.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: tolato-agent-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: list artifacts
        run: ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
