name: release-cli

# Build the `tolato` CLI on tag push and attach the binaries to a GitHub
# Release. Tag format: cli-v*  (e.g. cli-v0.1.0) — the CLI versions
# independently of the agent (agent-v*) and the server (bare v*).
#
# IMPORTANT: this workflow must never claim the "latest" release. The agent
# install script (scripts/install.sh) fetches
#   https://github.com/<repo>/releases/latest/download/tolato-agent-<os>-<arch>
# so /releases/latest has to keep resolving to a release-agent.yml release.
# Hence make_latest: false below — a CLI release is published, but not marked
# latest. Download the CLI from its own tag URL:
#   https://github.com/<repo>/releases/download/cli-v<x.y.z>/tolato-<os>-<arch>
#
# Because /releases/latest is spoken for, every release here is also republished
# under the moving `cli-latest` tag, so anything that wants "the newest CLI"
# without naming a version has a URL to use:
#   https://github.com/<repo>/releases/download/cli-latest/tolato-<os>-<arch>
# The agent skill installs from that path (through a Tolato server's /releases
# mirror), which is why it must keep working.

on:
  push:
    tags:
      - 'cli-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # cli/go.mod carries `toolchain go1.24.1`; matching it here avoids
          # making every job download a second toolchain before it can build.
          go-version: '1.24'
          cache-dependency-path: cli/go.sum

      - name: build
        working-directory: cli
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          # Tag push → e.g. "cli-v0.1.0"; manual run → branch name. Strip the
          # "cli-" prefix so `tolato version` reports the bare "v0.1.0".
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${REF_NAME#cli-}"
          OUT="tolato-${GOOS}-${GOARCH}"
          LDFLAGS="-s -w -X main.version=${VERSION}"
          go build -trimpath -ldflags "${LDFLAGS}" -o "../dist/${OUT}" .
          (cd ../dist && sha256sum "${OUT}" > "${OUT}.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: tolato-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      # Checked out before the artifacts land: actions/checkout cleans the
      # workspace, which would take `dist/` with it if it ran second.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: list artifacts
        run: ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          # See the header comment: /releases/latest belongs to the agent.
          make_latest: false

      # The moving pointer. action-gh-release updates an existing release in
      # place but will not relocate the tag underneath it, so move the tag
      # first — otherwise cli-latest keeps pointing at whichever commit first
      # created it while its assets quietly advance.
      - name: move the cli-latest tag onto this commit
        run: |
          git tag -f cli-latest
          git push -f origin cli-latest

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: cli-latest
          name: cli-latest
          files: dist/*
          fail_on_unmatched_files: true
          # Same reason as above, and doubly so: this one is republished on
          # every CLI release and would otherwise steal the agent's pointer.
          make_latest: false
          body: |
            Moving pointer to the newest `tolato` CLI build, republished on
            every `cli-v*` release so that installers have a URL that does not
            name a version. The binaries are byte-identical to the `cli-v*`
            release they came from, and `tolato version` reports that version.

            Pin a `cli-v*` tag instead when you want a specific build.
